services:
  rag-web:
    build: .
    ports:
      - "8501:8501"
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?set DEEPSEEK_API_KEY}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:?set DEEPSEEK_BASE_URL}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      RAG_INDEX_AUTO_BUILD: "false"
    volumes:
      - ./data/raw/城市轨道交通工程设计标准.pdf:/data/document.pdf:ro
      - rag-indexes:/indexes
      - rag-models:/models
    restart: unless-stopped

volumes:
  rag-indexes:
  rag-models:
